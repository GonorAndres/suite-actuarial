[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suite-actuarial"
version = "2.1.0"
description = "Laboratorio actuarial abierto para construir, probar y comprender productos"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Andres Gonzalez Ortega", email = "andres@actuarial.dev"}
]
keywords = ["seguros", "actuarial", "mexico", "cnsf", "reinsurance", "pensiones", "danos", "salud", "gmm", "imss"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

# Dependencias principales
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.25.0",
    "scipy>=1.11.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
# Para desarrollo
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.92.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
    "ipython>=8.18.0",
]

# Analitica y formatos opcionales; no son necesarios para importar el nucleo.
analytics = [
    "polars>=0.19.0",
    "chainladder>=0.8.18",
    "lifelines>=0.27.8",
    "openpyxl>=3.1.0",
    "pyarrow>=14.0.0",
]

# Para visualización y apps
viz = [
    "plotly>=5.18.0",
    "streamlit>=1.29.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

# Para bases de datos
db = [
    "sqlalchemy>=2.0.0",
    "duckdb>=0.9.0",
]

# Para API REST
api = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.25.0",
]

# Todo junto
all = [
    "suite-actuarial[dev,analytics,viz,db,api]",
]

[project.scripts]
# CLI para usar desde terminal
seguros = "suite_actuarial.cli:main"

[project.urls]
Homepage = "https://github.com/GonorAndres/suite-actuarial"
Documentation = "https://github.com/GonorAndres/suite-actuarial#readme"
Repository = "https://github.com/GonorAndres/suite-actuarial"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# `py.typed` (PEP 561) publica las anotaciones del paquete. Sin el, mypy trata
# `suite_actuarial` como sin tipos cuando lo importa codigo de fuera del arbol
# comprobado -- que es lo que pasaba con `examples/` y `streamlit_app/`.
suite_actuarial = ["py.typed", "data/mortality_tables/*.csv", "data/mortality_tables/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=suite_actuarial",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (lo maneja el formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # imports no usados están ok en __init__

[tool.mypy]
# El paquete soporta 3.11 en adelante (`requires-python`), pero mypy analiza aqui
# 3.12 a proposito: los stubs de numpy >= 2.3 usan la sentencia `type` de PEP 695 y
# mypy se niega a parsearlos bajo `python_version = "3.11"`, abortando la revision
# completa antes de mirar una sola linea del proyecto. Control compensatorio: el
# job de CI con Python 3.11 ejecuta la suite real, asi que cualquier sintaxis
# incompatible con 3.11 falla al importar.
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "openpyxl.*",
    "pandas.*",
    "scipy.*",
]
ignore_missing_imports = true

# Las pruebas no llevan anotaciones de retorno: una funcion `test_*` siempre
# devuelve `None` y anotarlo no aporta informacion. El resto de comprobaciones
# (tipos de argumento, atributos, retornos incompatibles) si corre sobre `tests/`.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
