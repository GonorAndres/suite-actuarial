name: Deploy backend to Cloud Run

# Dos entornos, una sola definicion:
#   main -> servicio `suite-actuarial`      (publico, api.gonor.me)
#   dev  -> servicio `suite-actuarial-dev`  (solo alcanzable por el proxy de
#           Cloudflare, que anade la cabecera compartida)
#
# El despliegue espera a que CI termine en verde. Antes ambos flujos corrian en
# paralelo sobre el mismo push, asi que una compuerta roja no impedia publicar.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, dev]

env:
  PROJECT_ID: project-ad7a5be2-a1c7-4510-82d
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/project-ad7a5be2-a1c7-4510-82d/suite-actuarial/dashboard

jobs:
  deploy:
    # Sin esto, un CI en rojo seguiria desplegando.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout the commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve environment
        id: env
        run: |
          if [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            echo "service=suite-actuarial" >> "$GITHUB_OUTPUT"
            echo "cors=https://suite.gonor.me" >> "$GITHUB_OUTPUT"
            # Produccion es publica a proposito: sin secreto, sin muro.
            echo "secret=" >> "$GITHUB_OUTPUT"
            echo "max_instances=2" >> "$GITHUB_OUTPUT"
          else
            # El frontend de dev llama al API por su mismo origen, a traves del
            # proxy de Cloudflare, asi que este origen basta.
            echo "service=suite-actuarial-dev" >> "$GITHUB_OUTPUT"
            echo "cors=https://dev-suite.gonor.me" >> "$GITHUB_OUTPUT"
            echo "secret=${{ secrets.PROXY_SHARED_SECRET }}" >> "$GITHUB_OUTPUT"
            # Dev lo usa una persona detras de Access: una instancia basta y
            # acota el gasto si algo entra en bucle.
            echo "max_instances=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/451451662791/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@project-ad7a5be2-a1c7-4510-82d.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          SHA=${{ github.event.workflow_run.head_sha }}
          SERVICE=${{ steps.env.outputs.service }}
          docker build -t ${{ env.IMAGE }}:$SHA -t ${{ env.IMAGE }}:$SERVICE .
          docker push ${{ env.IMAGE }}:$SHA
          docker push ${{ env.IMAGE }}:$SERVICE

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ steps.env.outputs.service }} \
            --image=${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --port=8080 \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=${{ steps.env.outputs.max_instances }} \
            --concurrency=80 \
            --timeout=60 \
            --cpu-throttling \
            --service-account=suite-actuarial-run@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --set-env-vars="PYTHONPATH=/app/src,SUITE_CORS_ORIGINS=${{ steps.env.outputs.cors }},SUITE_PROXY_SHARED_SECRET=${{ steps.env.outputs.secret }}"
