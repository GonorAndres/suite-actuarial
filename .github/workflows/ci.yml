name: CI

# Sin filtro de rama: cualquier rama de trabajo pasa por CI. Antes solo
# corrian `main` y `develop`, asi que una rama de feature podia acumular
# commits sin verificacion hasta el momento del PR.
on:
  push:
  pull_request:

jobs:
  # Las tres compuertas estaticas corren una sola vez: no dependen de la version
  # del interprete y repetirlas por cada entrada de la matriz no aporta senal.
  quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,api,viz]"

    - name: Lint with ruff
      run: ruff check src/ tests/ examples/ streamlit_app/

    - name: Check formatting with ruff
      run: ruff format --check src/ tests/ examples/ streamlit_app/

    - name: Type check with mypy
      # Usa la configuracion de pyproject.toml a proposito: pasar
      # --ignore-missing-imports por linea de comandos ocultaba errores reales.
      run: mypy src/ tests/ examples/ streamlit_app/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,api]"

    - name: Build and install wheel
      run: |
        python -m pip install build
        python -m build --wheel --outdir /tmp/suite-actuarial-dist
        python -m pip install --force-reinstall /tmp/suite-actuarial-dist/*.whl

    - name: Test with pytest
      # SUITE_REQUIRE_API=1 convierte en fallo el skip silencioso de las pruebas
      # de integracion cuando faltan los extras de API.
      env:
        SUITE_REQUIRE_API: "1"
      run: |
        pytest --cov=suite_actuarial --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: /api/v1

    - name: Install browser
      run: npx playwright install --with-deps chromium

    - name: Frontend smoke tests
      run: npm run test:e2e

  # La imagen que se despliega. Sin esta compuerta, el `docker build` de
  # `deploy.yml` era el unico lugar donde se construia la imagen, asi que un
  # Dockerfile roto pasaba las cuatro compuertas en verde y fallaba al
  # desplegar. Fue exactamente lo que ocurrio: `COPY data/ data/` sobrevivio a
  # la eliminacion de ese directorio y rompio el despliegue de `main` mientras
  # CI seguia en verde.
  #
  # No basta con que la imagen construya: tiene que arrancar y responder. La
  # tabla de mortalidad viaja como package-data, y un error de empaquetado solo
  # se ve al cargarla.
  docker:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build the deployment image
      run: docker build -t suite-actuarial:ci .

    - name: The packaged mortality table has to load
      run: |
        docker run --rm suite-actuarial:ci python -c "
        from suite_actuarial.actuarial.mortality.tablas import TablaMortalidad
        TablaMortalidad.cargar_emssa09()
        print('mortality table loaded')
        "

    - name: The container has to serve
      run: |
        docker run -d --rm --name sa-ci -p 8080:8080 suite-actuarial:ci
        for i in $(seq 1 30); do
          curl -sf http://127.0.0.1:8080/health && break
          sleep 2
        done
        curl -sf http://127.0.0.1:8080/health
        curl -sf http://127.0.0.1:8080/api/info
        docker stop sa-ci

  # El borde publico del API. Sus pruebas corren dentro de workerd, el mismo
  # runtime que sirve produccion, asi que una diferencia de comportamiento
  # aparece aqui y no despues del despliegue.
  edge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: edge/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Type check
      run: npm run typecheck

    - name: Test
      run: npm test
